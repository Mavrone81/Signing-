# Bevora Sign — box-165 override. Merge on top of the base + prod files:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.165.yml up -d --build app
#
# Box 165 runs host nginx + certbot fronting every stack on it, and that host
# nginx is what terminates TLS for sign.bevorasg.com. So `app` publishes a
# loopback port directly here and the host proxies to it.
#
# Container names are re-prefixed `bevorasign-*` so every docker command on
# this shared multi-tenant box can be scoped by name to this stack alone.
services:
  app:
    container_name: bevorasign-app
    # 127.0.0.1 ONLY. 165 is a multi-tenant box on the public internet; a
    # 0.0.0.0 bind would expose the app around the reverse proxy and around
    # TLS. The host nginx vhost proxies to this port.
    ports:
      - "127.0.0.1:13300:3000"

  db:
    container_name: bevorasign-db
    # The base file maps 127.0.0.1:13101 for host-side psql. Dropped here:
    # this box is shared with other developers' stacks, and a database needs
    # no host port at all. Debug with `docker exec -it bevorasign-db psql`.
    ports: !override []

