# Bevora Sign — box-165 override. Merge on top of the base + prod files:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.165.yml up -d --build app
#
# Why this file exists at all: the base stack containerizes nginx because the
# RMA .116 host has no host-level nginx and its docker user has no sudo. Box
# 165 is the opposite — it runs host nginx 1.24 + certbot fronting ~17 other
# stacks, and that host nginx is what terminates TLS for sign.bevorasg.com.
# Running a second nginx in a container would be a pointless extra hop, so
# here `app` publishes a loopback port directly and the host proxies to it.
#
# Container names are re-prefixed `bevorasign-*` so that every docker command
# on this shared box can be scoped by name to this stack alone, and so nothing
# reads as the RMA "digital-signing" deployment it was forked from.
services:
  app:
    container_name: bevorasign-app
    # 127.0.0.1 ONLY. 165 is a multi-tenant box on the public internet; a
    # 0.0.0.0 bind would expose the app around the reverse proxy and around
    # TLS. The host nginx vhost proxies to this port.
    ports:
      - "127.0.0.1:13300:3000"

  db:
    container_name: bevorasign-db
    # The base file maps 127.0.0.1:13101 for host-side psql. Dropped here:
    # this box is shared with other developers' stacks, and a database needs
    # no host port at all. Debug with `docker exec -it bevorasign-db psql`.
    ports: !override []

  nginx:
    # Not "removed" — compose overrides cannot delete a service — but given a
    # profile that is never requested, so `up` never starts it. The base
    # definition stays intact for the .116-style deployment.
    profiles:
      - containerized-proxy
