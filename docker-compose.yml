# Digital Signing — base stack (app + db). Deployed on the RMA .116 docker
# host behind nginx (see deploy/nginx-digital-signing.conf). Real secrets
# live in a git-ignored .env on the server (see .env.example for the
# contract) — never commit .env.
#
# Public hop is the `nginx` service (publishes host :8080, LAN) which proxies
# to `app` over the internal docker network. `app` has NO host port — it is
# reachable only through nginx. Postgres is bound to 127.0.0.1 only and never
# leaves the host. In-cluster, `app` reaches `db` over the docker network via
# hostname `db:5432` — DATABASE_URL in .env targets `db`, not localhost (the
# host-mapped 13101 is for host-side psql/debugging only).
#
# The .116 host runs no host-level nginx and the docker user has no sudo, so
# nginx is containerized here (survives the flock-cron redeploys). LAN-reachable
# at http://<deploy-host>:8080, protected by network segmentation;
# internal-only, no TLS in v1. FOLLOW-UP (deferred): add TLS + hostname or front
# via the IIS .150 reverse-proxy (LE cert) like atten/opsdash.
services:
  db:
    image: postgres:16
    container_name: digital-signing-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digital_signing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-digital_signing}
    ports:
      - "127.0.0.1:13101:5432"
    volumes:
      - digital_signing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_signing} -d ${POSTGRES_DB:-digital_signing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-signing-app
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    # No host port: `app` is reachable only via the nginx service below.
    expose:
      - "3000"
    volumes:
      - digital_signing_uploads:/data/uploads

  nginx:
    # Pinned to a recent patched mainline (avoid stale 1.27-alpine —
    # CVE-2026-42945 per the dependency-CVE-hygiene SOP). The estate CVE
    # monitor should keep this current.
    image: nginx:1.29-alpine
    container_name: digital-signing-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx-digital-signing.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  digital_signing_pgdata:
  digital_signing_uploads:
