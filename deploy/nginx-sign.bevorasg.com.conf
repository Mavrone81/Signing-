# Bevora Sign — host nginx vhost for box 165 (sign.bevorasg.com).
#
# Install as /etc/nginx/sites-available/sign.bevorasg.com.conf, symlink into
# sites-enabled, `nginx -t`, reload, then run:
#     certbot --nginx -d sign.bevorasg.com
# Certbot rewrites this file in place to add the listen 443 / ssl_certificate
# lines and the :80 redirect, exactly as it has for the other bevorasg.com
# vhosts on this box.
#
# THIS BOX FRONTS ~17 STACKS. `nginx -t` before every reload, and never touch
# a server block you did not add.

server {
    listen 80;
    listen [::]:80;
    server_name sign.bevorasg.com;

    # PDFs are the payload of this app; the default 1m would reject most real
    # documents. Matches MAX_UPLOAD_MB=25 in .env with headroom for the
    # multipart envelope.
    client_max_body_size 30m;

    location / {
        proxy_pass         http://127.0.0.1:13300;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Auth.js derives cookie security and callback URLs from this — get it
        # wrong and sign-in silently loops on a redirect.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Server-side PDF work and large uploads outlast the 60s default.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;

        # Room for large UPSTREAM RESPONSE HEADERS. The SSO callback sets the
        # Auth.js session as several chunked cookies; if the headers outgrow
        # the default 4k/8k buffer, nginx answers 502 and discards a response
        # whose token exchange had ALREADY succeeded. The user retries, the
        # one-time code is replayed and rejected, and it looks like an identity
        # provider fault. It depends on cookie size, so it breaks some accounts
        # and not others. Sized well above the largest session cookie set.
        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;
    }
}

# Two related lessons deliberately NOT applied here, because this topology
# doesn't have the problem:
#  - "resolver + variable upstream so a container recreate doesn't 502": the
#    upstream is a fixed loopback port that Docker republishes to whatever the
#    new container's address is, so nginx never holds a stale container IP.
#  - "reload doesn't apply a bind-mounted config": this is a host file, not a
#    file bind-mounted into an nginx container, so `nginx -t && reload` applies
#    it. (Certbot edits it in place — re-check its server blocks after.)
