# Bevora Sign — base stack (app + db). Real secrets live in a git-ignored
# .env on the server (see .env.example for the contract) — never commit .env.
#
# Postgres is bound to 127.0.0.1 only and never leaves the host. In-cluster,
# `app` reaches `db` over the docker network via hostname `db:5432` —
# DATABASE_URL in .env targets `db`, not localhost (the host-mapped 13101 is
# for host-side psql/debugging only).
#
# This file defines no public hop. The deploy target (box 165) terminates TLS
# at its own host nginx + certbot and proxies to a loopback port published by
# `app` — see docker-compose.165.yml and deploy/nginx-sign.bevorasg.com.conf.
services:
  db:
    image: postgres:16
    container_name: digital-signing-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digital_signing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-digital_signing}
    ports:
      - "127.0.0.1:13101:5432"
    volumes:
      - digital_signing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_signing} -d ${POSTGRES_DB:-digital_signing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-signing-app
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    # No host port here: the deploy overlay decides how `app` is exposed
    # (docker-compose.165.yml publishes it on 127.0.0.1 for the host nginx).
    expose:
      - "3000"
    volumes:
      - digital_signing_uploads:/data/uploads


volumes:
  digital_signing_pgdata:
  digital_signing_uploads:
